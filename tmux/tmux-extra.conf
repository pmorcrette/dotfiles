
# Couleurs vraies + soulignés stylés sous kitty
set -ga terminal-overrides ",xterm-kitty:Tc"
set -as terminal-features ",xterm-kitty:RGB,usstyle"

# Presse-papiers : les yanks tmux remontent vers kitty via OSC52
set -g set-clipboard on
set -g allow-passthrough on        # laisse helix émettre ses propres OSC52

# Confort éditeur
set -g focus-events on             # helix/emacs voient le focus
setw -g pane-base-index 1
set -g renumber-windows on

# Splits / new-window dans le dossier courant
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# Copie façon vim -> presse-papiers système
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf rechargé"

# Popups : tes outils à portée de préfixe
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"
bind b display-popup -E -w 80% -h 80% "btop"

# Sélecteur de projet piloté par zoxide : ouvre/rejoint une session par dossier
# NB : remplace le défaut « préfixe + o » (pane suivant). Mets « O » si tu y tiens.
bind o display-popup -E -w 70% -h 60% "\
dir=\$(zoxide query -l | fzf --reverse --prompt='project> ') || exit 0; \
name=\$(basename \"\$dir\" | tr '. ' '__'); \
tmux new-session -d -s \"\$name\" -c \"\$dir\" 2>/dev/null; \
tmux switch-client -t \"\$name\""
